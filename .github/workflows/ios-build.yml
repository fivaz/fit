name: iOS Build

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ios-build.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: iOS Simulator Build
    runs-on: macos-latest

    env:
      CI: true
      HUSKY: 0
      NEXT_TELEMETRY_DISABLED: 1
      # Compile-only build: never installed on a device or uploaded anywhere, so a
      # placeholder API origin is enough to satisfy the static-export env check.
      API_BASE_URL: https://ios-ci-placeholder.example.com
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fit_ci?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Generate iOS assets, static export, and Capacitor sync
        run: pnpm --filter @fit/web run ios:build

      - name: iOS readiness checks
        run: pnpm --filter @fit/web run ios:readiness

      - name: Build App target for iOS Simulator (unsigned)
        working-directory: apps/web
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
