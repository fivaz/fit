name: Sync Secrets to Key Vault

# Manual-only: pushes each GitHub Environment's secrets into the matching Key Vault.
# Runs inside CI specifically so the plaintext value is never read outside a workflow run —
# secrets referenced via ${{ secrets.X }} are automatically masked in logs by GitHub Actions.
#
# Secrets are scoped per GitHub Environment (Settings → Environments → dev | staging | prod), so
# every environment uses the same secret names with its own values. The job below declares
# `environment: <name>`, which is what makes GitHub expose that environment's secrets to it (and
# apply its protection rules, e.g. required reviewers on prod). A secret defined at both the repo
# and environment level resolves to the environment value.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment(s) to sync secrets for"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - dev
          - staging
          - prod

jobs:
  sync:
    name: Sync ${{ matrix.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.target == 'all' && '["dev","staging","prod"]' || format('["{0}"]', inputs.target)) }}
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sync secrets to Key Vault
        env:
          # Same naming as azure-deploy.yml: kv-<project>-<env>[-<suffix>]
          KV_NAME: kv-fit-${{ matrix.environment }}${{ vars.AZURE_RESOURCE_SUFFIX && format('-{0}', vars.AZURE_RESOURCE_SUFFIX) || '' }}
          # Values are passed through env vars rather than interpolated into the script text, so
          # characters like $, & or quotes in a connection string can't break (or inject into) the shell.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          synced=0
          skipped=0

          sync_secret() {
            local kv_secret_name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::warning::${kv_secret_name} is not set in the '${{ matrix.environment }}' environment; skipping"
              skipped=$((skipped + 1))
              return
            fi
            az keyvault secret set --vault-name "$KV_NAME" --name "$kv_secret_name" --value "$value" --output none
            echo "${{ matrix.environment }} ${kv_secret_name} synced to ${KV_NAME}"
            synced=$((synced + 1))
          }

          sync_secret DATABASE-URL "$DATABASE_URL"
          sync_secret OPENAI-API-KEY "$OPENAI_API_KEY"
          sync_secret STRIPE-SECRET-KEY "$STRIPE_SECRET_KEY"
          sync_secret STRIPE-WEBHOOK-SECRET "$STRIPE_WEBHOOK_SECRET"

          echo "Done: ${synced} synced, ${skipped} skipped"
