name: Sync Secrets to Key Vault

# Manual-only: pushes GitHub Actions secrets into the matching environment's Key Vault.
# Runs inside CI specifically so the plaintext value is never read outside a workflow run —
# secrets referenced via ${{ secrets.X }} are automatically masked in logs by GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which environment(s) to sync secrets for'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - dev
          - staging
          - prod

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sync dev DATABASE-URL
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'dev'
        run: |
          az keyvault secret set --vault-name kv-fit-dev-139d --name DATABASE-URL --value "${{ secrets.DATABASE_URL_DEV }}" --output none
          echo "dev DATABASE-URL synced"

      - name: Sync staging DATABASE-URL
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'staging'
        run: |
          az keyvault secret set --vault-name kv-fit-staging-139d --name DATABASE-URL --value "${{ secrets.DATABASE_URL }}" --output none
          echo "staging DATABASE-URL synced"

      - name: Sync prod DATABASE-URL
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'prod'
        run: |
          az keyvault secret set --vault-name kv-fit-prod-139d --name DATABASE-URL --value "${{ secrets.DATABASE_URL }}" --output none
          echo "prod DATABASE-URL synced"

      - name: Sync dev OPENAI-API-KEY
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'dev'
        run: |
          az keyvault secret set --vault-name kv-fit-dev-139d --name OPENAI-API-KEY --value "${{ secrets.OPENAI_API_KEY_DEV }}" --output none
          echo "dev OPENAI-API-KEY synced"

      - name: Sync staging OPENAI-API-KEY
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'staging'
        run: |
          az keyvault secret set --vault-name kv-fit-staging-139d --name OPENAI-API-KEY --value "${{ secrets.OPENAI_API_KEY }}" --output none
          echo "staging OPENAI-API-KEY synced"

      - name: Sync prod OPENAI-API-KEY
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'prod'
        run: |
          az keyvault secret set --vault-name kv-fit-prod-139d --name OPENAI-API-KEY --value "${{ secrets.OPENAI_API_KEY }}" --output none
          echo "prod OPENAI-API-KEY synced"

      - name: Sync dev STRIPE-SECRET-KEY
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'dev'
        run: |
          az keyvault secret set --vault-name kv-fit-dev-139d --name STRIPE-SECRET-KEY --value "${{ secrets.STRIPE_SECRET_KEY_DEV }}" --output none
          echo "dev STRIPE-SECRET-KEY synced"

      - name: Sync staging STRIPE-SECRET-KEY
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'staging'
        run: |
          az keyvault secret set --vault-name kv-fit-staging-139d --name STRIPE-SECRET-KEY --value "${{ secrets.STRIPE_SECRET_KEY }}" --output none
          echo "staging STRIPE-SECRET-KEY synced"

      - name: Sync prod STRIPE-SECRET-KEY
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'prod'
        run: |
          az keyvault secret set --vault-name kv-fit-prod-139d --name STRIPE-SECRET-KEY --value "${{ secrets.STRIPE_SECRET_KEY }}" --output none
          echo "prod STRIPE-SECRET-KEY synced"

      - name: Sync dev STRIPE-WEBHOOK-SECRET
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'dev'
        run: |
          az keyvault secret set --vault-name kv-fit-dev-139d --name STRIPE-WEBHOOK-SECRET --value "${{ secrets.STRIPE_WEBHOOK_SECRET_DEV }}" --output none
          echo "dev STRIPE-WEBHOOK-SECRET synced"

      - name: Sync staging STRIPE-WEBHOOK-SECRET
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'staging'
        run: |
          az keyvault secret set --vault-name kv-fit-staging-139d --name STRIPE-WEBHOOK-SECRET --value "${{ secrets.STRIPE_WEBHOOK_SECRET }}" --output none
          echo "staging STRIPE-WEBHOOK-SECRET synced"

      - name: Sync prod STRIPE-WEBHOOK-SECRET
        if: github.event.inputs.target == 'all' || github.event.inputs.target == 'prod'
        run: |
          az keyvault secret set --vault-name kv-fit-prod-139d --name STRIPE-WEBHOOK-SECRET --value "${{ secrets.STRIPE_WEBHOOK_SECRET }}" --output none
          echo "prod STRIPE-WEBHOOK-SECRET synced"
