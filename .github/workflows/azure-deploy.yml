name: Deploy to Azure

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/fit-api
  # Suffixes every Azure resource name (rg-fittracker-dev-<suffix>, kv-fittracker-dev-<suffix>, ...)
  # so CI targets the same stack as manual `deploy.sh` runs. Set via repo Settings → Variables.
  AZURE_RESOURCE_SUFFIX: ${{ vars.AZURE_RESOURCE_SUFFIX }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required for pushing to ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels}}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event.inputs.environment }}" != "" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          else
            ENVIRONMENT="dev"
          fi
          SUFFIX="${AZURE_RESOURCE_SUFFIX}"
          RG_NAME="rg-fittracker-${ENVIRONMENT}${SUFFIX:+-$SUFFIX}"
          KV_NAME="kv-fittracker-${ENVIRONMENT}${SUFFIX:+-$SUFFIX}"

          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          echo "rg_name=$RG_NAME" >> $GITHUB_OUTPUT
          echo "kv_name=$KV_NAME" >> $GITHUB_OUTPUT

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "${{ steps.env.outputs.rg_name }}" \
            --location northeurope \
            --tags Project="Fit Tracker" Environment="${{ steps.env.outputs.environment }}" ManagedBy="Bicep" \
            --output none

      - name: Deploy Infrastructure
        id: deploy
        run: |
          cd infrastructure/bicep

          DEPLOYMENT_NAME="fittracker-${{ steps.env.outputs.environment }}-$(date +%Y%m%d-%H%M%S)"
          echo "deployment_name=$DEPLOYMENT_NAME" >> $GITHUB_OUTPUT

          # Deploy with Container Apps enabled (image was just built)
          az deployment group create \
            --resource-group "${{ steps.env.outputs.rg_name }}" \
            --template-file main.bicep \
            --parameters params.${{ steps.env.outputs.environment }}.json \
            --parameters resourceSuffix="${{ steps.env.outputs.suffix }}" \
            --parameters deployContainerApps=true \
            --parameters externalAcrLoginServer="${{ env.REGISTRY }}/${{ github.repository }}" \
            --name "$DEPLOYMENT_NAME"

      - name: Get deployment outputs
        id: outputs
        run: |
          # Use the exact deployment name we generated above — `az deployment group list`
          # returns every nested module deployment at this RG scope too, with no
          # guaranteed ordering, so picking "[0]" can silently return the wrong (or an
          # output-less) deployment.
          API_URL=$(az deployment group show \
            --resource-group "${{ steps.env.outputs.rg_name }}" \
            --name "${{ steps.deploy.outputs.deployment_name }}" \
            --query "properties.outputs.apiUrl.value" -o tsv)

          SPA_URL=$(az deployment group show \
            --resource-group "${{ steps.env.outputs.rg_name }}" \
            --name "${{ steps.deploy.outputs.deployment_name }}" \
            --query "properties.outputs.staticWebsiteUrl.value" -o tsv)

          STORAGE_ACCOUNT_NAME=$(az deployment group show \
            --resource-group "${{ steps.env.outputs.rg_name }}" \
            --name "${{ steps.deploy.outputs.deployment_name }}" \
            --query "properties.outputs.storageAccountName.value" -o tsv)

          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "spa_url=$SPA_URL" >> $GITHUB_OUTPUT
          echo "storage_account_name=$STORAGE_ACCOUNT_NAME" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: |
          # Set DATABASE_URL from Azure Key Vault
          DATABASE_URL=$(az keyvault secret show \
            --vault-name "${{ steps.env.outputs.kv_name }}" \
            --name DATABASE-URL \
            --query "value" -o tsv)

          export DATABASE_URL
          pnpm run db:deploy
        env:
          NODE_ENV: production

      - name: Build static frontend
        run: pnpm run build:static
        env:
          NODE_ENV: production
          API_BASE_URL: ${{ steps.outputs.outputs.api_url }}

      - name: Deploy static frontend
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --account-name "${{ steps.outputs.outputs.storage_account_name }}" \
            --resource-group "${{ steps.env.outputs.rg_name }}" \
            --query "[0].value" -o tsv)

          # Idempotent: enabling static website hosting is a data-plane setting,
          # not a declarative ARM/Bicep resource property, so it's done here on every deploy.
          az storage blob service-properties update \
            --account-name "${{ steps.outputs.outputs.storage_account_name }}" \
            --account-key "$STORAGE_KEY" \
            --static-website \
            --index-document index.html \
            --404-document 404.html \
            --output none

          az storage blob upload-batch \
            --account-name "${{ steps.outputs.outputs.storage_account_name }}" \
            --account-key "$STORAGE_KEY" \
            --destination '$web' \
            --source ./apps/web/out \
            --overwrite \
            --output none

      - name: Deployment Summary
        run: |
          echo "## Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** ${{ steps.outputs.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**SPA URL:** ${{ steps.outputs.outputs.spa_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Image:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
