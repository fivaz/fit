name: 'Cloudflare Worker route sync'
description: 'Idempotently uploads a Cloudflare Worker script and ensures a route binds it to <route_domain>/* on the given zone'

inputs:
  account_id:
    description: 'Cloudflare account ID'
    required: true
  zone_id:
    description: 'Cloudflare zone ID'
    required: true
  api_token:
    description: 'Cloudflare API token, scoped to Account:Workers Scripts:Edit and Zone:Workers Routes:Edit on this zone'
    required: true
  script_name:
    description: 'Worker script name'
    required: true
  script_path:
    description: 'Path to the worker module source file (ES module, must export a default fetch handler)'
    required: true
  route_domain:
    description: 'Domain the route is scoped to, e.g. fit-dev.sfivaz.com (pattern becomes "<route_domain>/*")'
    required: true

runs:
  using: composite
  steps:
    - id: sync
      shell: bash
      env:
        CF_ACCOUNT_ID: ${{ inputs.account_id }}
        CF_ZONE_ID: ${{ inputs.zone_id }}
        CF_API_TOKEN: ${{ inputs.api_token }}
        SCRIPT_NAME: ${{ inputs.script_name }}
        SCRIPT_PATH: ${{ inputs.script_path }}
        ROUTE_PATTERN: ${{ inputs.route_domain }}/*
      run: |
        set -euo pipefail

        api() {
          local method="$1" path="$2"
          shift 2
          curl -sS -X "$method" "https://api.cloudflare.com/client/v4/$path" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "$@"
        }

        echo "Uploading worker script $SCRIPT_NAME"
        upload=$(api PUT "accounts/$CF_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME" \
          -F 'metadata={"main_module":"worker.js","compatibility_date":"2024-09-23"};type=application/json' \
          -F "worker.js=@$SCRIPT_PATH;type=application/javascript+module;filename=worker.js")
        if [ "$(echo "$upload" | jq -r '.success')" != "true" ]; then
          echo "::error::Failed to upload worker script: $(echo "$upload" | jq -c '.errors')"
          exit 1
        fi

        echo "Checking existing routes for pattern $ROUTE_PATTERN"
        routes=$(api GET "zones/$CF_ZONE_ID/workers/routes")
        if [ "$(echo "$routes" | jq -r '.success')" != "true" ]; then
          echo "::error::Failed to list routes: $(echo "$routes" | jq -c '.errors')"
          exit 1
        fi

        route_id=$(echo "$routes" | jq -r --arg p "$ROUTE_PATTERN" '.result[] | select(.pattern == $p) | .id' | head -n1)
        body=$(jq -n --arg pattern "$ROUTE_PATTERN" --arg script "$SCRIPT_NAME" '{pattern: $pattern, script: $script}')

        if [ -z "$route_id" ]; then
          echo "Creating route $ROUTE_PATTERN -> $SCRIPT_NAME"
          result=$(api POST "zones/$CF_ZONE_ID/workers/routes" -H "Content-Type: application/json" --data "$body")
        else
          echo "Route $ROUTE_PATTERN already exists (id $route_id), updating script binding"
          result=$(api PUT "zones/$CF_ZONE_ID/workers/routes/$route_id" -H "Content-Type: application/json" --data "$body")
        fi

        if [ "$(echo "$result" | jq -r '.success')" != "true" ]; then
          echo "::error::Failed to sync route: $(echo "$result" | jq -c '.errors')"
          exit 1
        fi
